<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Envelope · Lyrics</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- ─── FALLING LEAVES BACKGROUND ─── -->
    <div class="bg-leaves" id="bgLeaves"></div>

    <!-- ─── ENVELOPE CARD ─── -->
    <main class="page" id="pageWrapper">
        <section class="card" id="cardWrapper">
            <div class="card-glow"></div>
            <div class="card-inner">
                <button class="envelope-button" type="button" aria-label="Open envelope" id="envelopeBtn">
                    <img src="envelope.png" alt="Pink envelope with flowers" />
                </button>
            </div>
        </section>
    </main>

    <!-- ─── SPLIT SCREEN ─── -->
    <div class="split-container" id="splitContainer">
        <div class="lyrics-panel" id="lyricsPanel">
            <div class="lyrics-title" id="lyricsTitle">
                <span class="name-lalay">Lalay</span>
                <span class="amp">&amp;</span>
                <span class="name-keith">Keith</span>
            </div>
            <div class="lyrics-content" id="lyricsContent"></div>
        </div>
        <div class="image-panel" id="imagePanel">
            <div class="slide-image" id="slideImage"></div>
        </div>
    </div>

    <!-- ─── "SAKIT NOH" ─── -->
    <div class="sakit-text" id="sakitText">Sakit Noh</div>

    <!-- ─── LOADING OVERLAY (heart-rate SVG loader) ─── -->
    <div class="loading-overlay" id="loadingOverlay" aria-hidden="true">
        <div class="loader-wrapper">
            <div class="loader" aria-hidden="false">
                <svg xmlns:xlink="https://www.w3.org/1999/xlink" xmlns="https://www.w3.org/2000/svg" width="550"
                    height="210" viewBox="0 0 550 210">
